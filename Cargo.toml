[package]
name = "terminalfm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A keyboard-first terminal music player with a real-time audio visualizer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lijnati/Terminal.fm"
readme = "README.md"
keywords = ["music", "player", "tui", "terminal", "visualizer"]
categories = ["command-line-utilities", "multimedia::audio"]
default-run = "terminalfm"

[[bin]]
name = "terminalfm"
path = "src/main.rs"

[[bin]]
name = "tfm"
path = "src/bin/tfm.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = { version = "0.6.5", default-features = false }
directories = "6.0.0"
lofty = "0.25.4"
ratatui = "0.30.2"
realfft = "3.5.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
unicode-width = "0.2.2"
walkdir = "2.5.0"

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"
